<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" aria-hidden="true">
  <!-- Below Namespaces, app-to-app isolation is an accepted risk -->
  <text class="dg-sub dg-ink-fail" x="16" y="40">Below Namespaces, app-to-app</text>
  <text class="dg-sub dg-ink-fail" x="16" y="56">isolation is an accepted risk.</text>
  <path class="dg-line-fail dg-dashed" d="M16 70 H472"/>

  <!-- Level 1: Processes -->
  <rect class="dg-box" x="16" y="170" width="220" height="114" rx="8"/>
  <text class="dg-label" x="30" y="190">LEVEL 1</text>
  <text class="dg-title" x="30" y="208">Processes</text>
  <text class="dg-sub" x="30" y="228">Own OS account and directory</text>
  <text class="dg-sub" x="30" y="244">Memory sampled, CPU not limited</text>
  <text class="dg-sub" x="30" y="270">Needs: root</text>

  <!-- Level 2: cgroups -->
  <rect class="dg-box" x="252" y="100" width="220" height="184" rx="8"/>
  <text class="dg-label" x="266" y="120">LEVEL 2</text>
  <text class="dg-title" x="266" y="138">cgroups</text>
  <text class="dg-sub" x="266" y="158">Everything in Processes, plus</text>
  <text class="dg-sub" x="266" y="174">memory and CPU limits the</text>
  <text class="dg-sub" x="266" y="190">kernel enforces, and at most</text>
  <text class="dg-sub" x="266" y="206">4,096 processes</text>
  <text class="dg-sub" x="266" y="254">Needs: a cgroup v2 hierarchy</text>
  <text class="dg-sub" x="266" y="270">Toft may write</text>

  <!-- Level 3: Namespaces -->
  <rect class="dg-accent" x="488" y="30" width="216" height="254" rx="8"/>
  <text class="dg-label" x="502" y="50">LEVEL 3</text>
  <text class="dg-title" x="502" y="68">Namespaces</text>
  <text class="dg-sub" x="502" y="88">Everything in cgroups, plus</text>
  <text class="dg-sub" x="502" y="104">its own network address,</text>
  <text class="dg-sub" x="502" y="120">its own view of the files and</text>
  <text class="dg-sub" x="502" y="136">its own process list</text>
  <text class="dg-title dg-ink-link" x="502" y="164" font-size="12">No app can reach another</text>
  <text class="dg-sub" x="502" y="254">Needs: CAP_SYS_ADMIN,</text>
  <text class="dg-sub" x="502" y="270">CAP_NET_ADMIN, iptables, ip</text>
</svg>
